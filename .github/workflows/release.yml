name: Release archive

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt
      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Verify metadata, tag, and committed website archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: python scripts/zenodo.py check --tag "$RELEASE_TAG" --archive
      - uses: actions/upload-artifact@v4
        with:
          name: gfmr-website
          path: |
            archive/gfmr-website.zip
            archive/gfmr-website.zip.sha256
          if-no-files-found: error

  attach:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gfmr-website
          path: archive
      - name: Attach verified archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" archive/gfmr-website.zip archive/gfmr-website.zip.sha256 --clobber
